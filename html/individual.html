<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Individual Student</title>
	<link rel="stylesheet" href="../css/individual.css">
</head>
<body>
	<video class="bg-video" autoplay muted loop playsinline preload="auto" aria-hidden="true">
		<source src="../videos/static%20outward.mp4" type="video/mp4" />
		Your browser does not support the video tag.
	</video>

	<main class="page">
		<section class="individual-card" id="individual-card" aria-live="polite">
			<p>Loading student...</p>
		</section>
		<a id="back-link" class="back-link" href="../index.html">Back</a>
	</main>

	<div id="time-limit-overlay" class="time-limit-overlay" aria-hidden="true">
		<img class="time-limit-image" src="../images/TimeLimit.jpg" alt="Time limit screen">
		<p id="time-limit-message" class="time-limit-message">You’ve reached your limit of 0 hours on phone.</p>
		<a class="time-limit-hotspot" href="../index.html" aria-label="Return to main page"></a>
		<a id="time-limit-ignore" class="time-limit-ignore" href="#" aria-label="Ignore limit and return to student page">Ignore Limit</a>
	</div>

	<script src="../Js/individual.js"></script>
</body>
</html>
